[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autorefactor"
version = "0.0.1"
description = "autorefactor.ai — multi-goal evidence engine + changeset queue for host agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "autorefactor.ai contributors" }]
keywords = ["refactoring", "llm", "embeddings", "code-quality", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "rich>=13.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "hdbscan>=0.8.33",
  "tqdm>=4.66.0",
  "tree-sitter>=0.22.0",
  "tree-sitter-java>=0.23.0",
  "tree-sitter-python>=0.23.0",
  "tree-sitter-go>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "matplotlib>=3.8.0",
  "mcp>=1.0.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]
analyzers = ["ruff>=0.6.0"]
# System CLIs expected on PATH when enabled: semgrep, eslint, pmd/spotbugs, c8/coverage

[project.scripts]
autorefactor = "autorefactor.cli:app"
autorefactor-mcp = "autorefactor.mcp.server:main"

[project.entry-points."autorefactor.sensors"]
"sim.method" = "autorefactor.sensors.builtins:sim_method"
"sim.class" = "autorefactor.sensors.builtins:sim_class"
"sim.fingerprint" = "autorefactor.sensors.builtins:sim_fingerprint"
slop = "autorefactor.sensors.builtins:slop"
placement = "autorefactor.sensors.builtins:placement"
structure = "autorefactor.sensors.builtins:structure"
complexity = "autorefactor.sensors.builtins:complexity"
coverage = "autorefactor.sensors.builtins:coverage"
"test_quality" = "autorefactor.sensors.builtins:test_quality"
contract = "autorefactor.sensors.builtins:contract"
cluster = "autorefactor.sensors.builtins:cluster"
"static.semgrep" = "autorefactor.sensors.builtins:static_semgrep"
"static.ruff" = "autorefactor.sensors.builtins:static_ruff"
"static.eslint" = "autorefactor.sensors.builtins:static_eslint"
"static.java" = "autorefactor.sensors.builtins:static_java"
wiring = "autorefactor.sensors.builtins:wiring"
supabase = "autorefactor.sensors.builtins:supabase"

[project.urls]
Homepage = "https://autorefactor.ai"
Repository = "https://github.com/henrique-milli/autorefactor"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autorefactor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
