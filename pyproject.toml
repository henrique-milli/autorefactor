[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderazor"
version = "0.1.0"
description = "coderazor.ai — analysis engine + changeset queue for host agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "coderazor.ai contributors" }]
keywords = ["refactoring", "llm", "embeddings", "code-quality", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "rich>=13.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "hdbscan>=0.8.33",
  "tqdm>=4.66.0",
  "tree-sitter>=0.22.0",
  "tree-sitter-java>=0.23.0",
  "tree-sitter-python>=0.23.0",
  "tree-sitter-go>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "matplotlib>=3.8.0",
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]
analyzers = ["ruff>=0.6.0"]
# System CLIs expected on PATH when enabled: semgrep, eslint, pmd/spotbugs, c8/coverage

[project.scripts]
coderazor = "coderazor.cli:app"
coderazor-mcp = "coderazor.mcp.server:main"

[project.urls]
Homepage = "https://coderazor.ai"
Repository = "https://github.com/coderazor-ai/coderazor"

[tool.setuptools.packages.find]
where = ["src"]
include = ["coderazor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
