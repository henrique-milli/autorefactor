name: autorefactor

services:
  autorefactor:
    container_name: autorefactor
    build: .
    image: autorefactor:local
    env_file:
      - path: .env
        required: false
    environment:
      AUTOREFACTOR_CHAT_BACKEND: ${AUTOREFACTOR_CHAT_BACKEND:-}
      AUTOREFACTOR_EMBED_BACKEND: ${AUTOREFACTOR_EMBED_BACKEND:-}
      AUTOREFACTOR_EMBED_DEVICE: ${AUTOREFACTOR_EMBED_DEVICE:-cpu}
      # Omit LOCAL_CHAT when unset — empty string breaks pydantic bool parsing
      AUTOREFACTOR_PROFILE: ${AUTOREFACTOR_PROFILE:-full}
      AUTOREFACTOR_MCP_TRANSPORT: ${AUTOREFACTOR_MCP_TRANSPORT:-streamable-http}
      AUTOREFACTOR_MCP_HOST: ${AUTOREFACTOR_MCP_HOST:-0.0.0.0}
      AUTOREFACTOR_MCP_PORT: ${AUTOREFACTOR_MCP_PORT:-8765}
      AUTOREFACTOR_MCP_MAX_BODY: ${AUTOREFACTOR_MCP_MAX_BODY:-536870912}
      AUTOREFACTOR_MCP_WORKSPACE: /workspace
      AUTOREFACTOR_MCP_PREFER_ACTIVE: ${AUTOREFACTOR_MCP_PREFER_ACTIVE:-0}
      AUTOREFACTOR_OLLAMA_BASE_URL: ${AUTOREFACTOR_OLLAMA_BASE_URL:-http://ollama:11434/v1}
      AUTOREFACTOR_LOCAL_LLM_MODEL: ${AUTOREFACTOR_LOCAL_LLM_MODEL:-gemma4:e2b}
      AUTOREFACTOR_LOCAL_EMBED_MODEL: ${AUTOREFACTOR_LOCAL_EMBED_MODEL:-nomic-embed-text}
      AUTOREFACTOR_LOCAL_EMBED_GPU_MODEL: ${AUTOREFACTOR_LOCAL_EMBED_GPU_MODEL:-qwen3-embedding:0.6b}
      AUTOREFACTOR_DESCRIBE_MODE: ${AUTOREFACTOR_DESCRIBE_MODE:-raw}
      AUTOREFACTOR_API_KEY: ${AUTOREFACTOR_API_KEY:-}
      HOME: /root
    ports:
      - "${AUTOREFACTOR_MCP_PORT:-8765}:${AUTOREFACTOR_MCP_PORT:-8765}"
    volumes:
      - ${AUTOREFACTOR_WORKSPACE:-.}:/workspace
      - ${AUTOREFACTOR_DATA:-./.autorefactor-data}:/root/.autorefactor
      # Live product code: restart the container after src edits (no image rebuild).
      - ./src:/app/src:ro
    working_dir: /workspace
    restart: unless-stopped

  web:
    container_name: autorefactor-web
    build:
      context: ./web
      args:
        AUTOREFACTOR_API_URL: http://autorefactor:8765
    image: autorefactor-web:local
    environment:
      AUTOREFACTOR_API_URL: http://autorefactor:8765
      PORT: "3000"
    ports:
      - "${AUTOREFACTOR_WEB_PORT:-3000}:3000"
    depends_on:
      - autorefactor
    restart: unless-stopped

  # Local embeddings / optional local chat — enable with: --profile ollama
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: autorefactor-ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${AUTOREFACTOR_OLLAMA_HOST_PORT:-11434}:11434"
    restart: unless-stopped

  ollama-init:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: autorefactor-ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      AUTOREFACTOR_CHAT_BACKEND: ${AUTOREFACTOR_CHAT_BACKEND:-agent}
      AUTOREFACTOR_EMBED_BACKEND: ${AUTOREFACTOR_EMBED_BACKEND:-local}
      AUTOREFACTOR_EMBED_DEVICE: ${AUTOREFACTOR_EMBED_DEVICE:-cpu}
      AUTOREFACTOR_LOCAL_LLM_MODEL: ${AUTOREFACTOR_LOCAL_LLM_MODEL:-gemma4:e2b}
      AUTOREFACTOR_LOCAL_EMBED_MODEL: ${AUTOREFACTOR_LOCAL_EMBED_MODEL:-nomic-embed-text}
      AUTOREFACTOR_LOCAL_EMBED_GPU_MODEL: ${AUTOREFACTOR_LOCAL_EMBED_GPU_MODEL:-qwen3-embedding:0.6b}
    volumes:
      - ./scripts/ollama_ensure_models.sh:/ensure_models.sh:ro
    entrypoint: ["/bin/sh", "/ensure_models.sh"]
    restart: "no"

volumes:
  ollama_models:
